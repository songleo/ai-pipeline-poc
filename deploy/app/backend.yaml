apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-demo-backend
  namespace: pipeline-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: pipeline-demo-backend}
  template:
    metadata:
      labels: {app: pipeline-demo-backend, app.kubernetes.io/part-of: pipeline-demo}
    spec:
      serviceAccountName: pipeline-demo-backend
      containers:
        - name: backend
          image: pipeline-demo-backend:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          env:
            - {name: PIPELINE_NAMESPACE, value: pipeline-demo}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: pipeline-demo-backend
  namespace: pipeline-demo
spec:
  selector: {app: pipeline-demo-backend}
  ports: [{name: http, port: 8000, targetPort: http}]

