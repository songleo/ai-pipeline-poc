[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pipeline-demo-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.136.3",
  "uvicorn==0.35.0",
  "pydantic==2.13.4",
  "kubernetes==33.1.0",
  "PyYAML==6.0.3",
  "requests==2.34.2"
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

